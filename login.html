<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Login | CvSU Naic Registrar</title>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/login.css">
</head>

<body>
  <div class="login-container">
    <!-- Left Section -->
    <div class="login-left">
      <img src="assets/images/logo.png" alt="CvSU Logo">
      <h1>Registrar Management Portal</h1>
      <p>Welcome back! Sign in to manage document requests, student records, and registrar services.</p>
    </div>

    <!-- Right Section - Login Form -->
    <div class="login-right">
      <div class="login-card">
        <h2>Staff Login</h2>
        <p>Sign in using your registrar credentials.</p>
        <form id="loginForm">
          <div class="input-group">
            <label>Email</label>
            <input type="email" id="email" placeholder="staff@cvsu.edu.ph" required>
          </div>
          <div class="input-group">
            <label>Password</label>
            <div class="password-box">
              <input type="password" id="password" placeholder="Password" required>
              <button type="button" id="togglePassword">👁</button>
            </div>
          </div>
          <div class="remember">
            <label><input type="checkbox"> Remember Me</label>
            <a href="#">Forgot Password?</a>
          </div>
          <button class="login-btn" type="submit">Login</button>
        </form>
        <a href="index.html" class="back-home">← Back to Homepage</a>
      </div>
    </div>
  </div>

  <div id="toast"></div>
  <script src="js/login.js"></script>
</body>
</html>
